name: Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Gizli Veri (Secret) Taraması
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks ile Tarama Yap
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Bağımlılık (Dependency) Taraması
  dependency-scanning:
    name: Dependency Scanning (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Paketleri Yükle
        run: npm ci --ignore-scripts
      - name: npm audit (Yüksek riskli açıkları denetle)
        run: npm audit --audit-level=high

  # 3. Statik Kod Analizi (SAST)
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
      - name: Semgrep ile TypeScript/JS Taraması
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/javascript"
          # Not: GitHub CodeQL gizli (private) repolarda ücretli olduğu için
          # açık/gizli tüm repolarda ücretsiz ve çok başarılı olan Semgrep kullanılmıştır.

  # 4. Konteyner / İşletim Sistemi Güvenliği
  container-scanning:
    name: Docker Image Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
      - name: Docker İmajını İnşa Et (Build)
        run: docker build -t bilet-ekosistemi:${{ github.sha }} .
      - name: Trivy ile Zafiyet Taraması
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bilet-ekosistemi:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Kritik bir açık bulunursa pipeline'ı durdur
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
