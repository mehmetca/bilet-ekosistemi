name: Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Gizli Veri (Secret) Taraması
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks ile Tarama Yap
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Canlıya Çıkan Bağımlılıkların Taraması
  #    --omit=dev: sadece production ağacı denetlenir; imaja girmeyen geliştirme
  #    araçlarındaki uyarılar kapıyı düşürmez.
  #    Bilinen, yayını etkilemeyen dev-ağacı high'ları: tailwindcss@3 zinciri
  #    (braces/micromatch/chokidar/fast-glob — üst sürümü yayınlanmadı) ve
  #    eslint-config-next@15 zinciri (glob/@next/eslint-plugin-next).
  #    Bunlar ancak tailwind v4 / next 16 major yükseltmesiyle kapanır.
  dependency-scanning:
    name: Dependency Scanning (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Paketleri Yükle
        run: npm ci --omit=dev --ignore-scripts
      - name: npm audit (orta ve üzeri açıklamaları denetle)
        run: npm audit --omit=dev --audit-level=high

  # 3. Statik Kod Analizi (SAST)
  #    Bilgi amaçlı: bulgular logda ve artifact'ta görünür, deploy'u engellemez.
  #    Kapıya çevirmek için son adımın --continue-on-error satırını sil ve
  #    önce mevcut bulguları temizle.
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
      - name: Semgrep Kur
        run: python3 -m pip install --quiet semgrep
      - name: TypeScript / JavaScript Taraması
        continue-on-error: true
        run: |
          semgrep scan --config p/typescript --config p/javascript \
            --metrics=off --sarif --output=semgrep.sarif | tee semgrep.txt
      - name: Raporu Arşivle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.txt
