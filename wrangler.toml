# Cloudflare Pages/Workers Configuration
# Bu dosya Cloudflare Pages deployment için hazırlanmıştır

name = "bilet-ekosistemi"
compatibility_date = "2024-01-01"

# Build configuration
[build]
command = "npm run build"
cwd = "."
watch_dirs = ["src", "public"]

# Environment variables (Cloudflare Pages dashboard'da da ayarlanmalı)
[vars]
NEXT_PUBLIC_SITE_URL = "https://your-site.com"
NODE_ENV = "production"

# Database connection pooling
[[kv_namespaces]]
binding = "CACHE"
id = "your_kv_namespace_id"

# Cron jobs (Cloudflare Workers Cron Triggers)
[triggers]
crons = ["0 9 * * *"] # Her gün 09:00

# Static asset optimization
[assets]
directory = "public"
binding = "ASSETS"

# Pages functions configuration
[functions]
  # Node.js compatibility
  node_compat = true
  
  # Memory limit
  memory_mb = 512
  
  # CPU limit
  cpu_ms = 50